<!doctype html>
<html>
<head>
   <meta charset="utf-8">
   <title>Сенсорне зображення — Лісовий водоспад</title>
</head>
<body bgcolor="#F5EEF8" text="#2C3E50">

   <h1 align="center"><font face="Verdana" color="#6C3483">Сенсорна карта: лісовий водоспад</font></h1>
   <hr color="#D7BDE2" size="2" width="75%">

   <p align="center">
      <font face="Verdana" size="3">
         Наведіть курсор миші на різні ділянки зображення, щоб побачити підказку для кожної області:
      </font>
   </p>

   <!-- Карта з багатокутниками під ділянки водоспаду зі скріншота -->
   <map name="waterfall_poly_map">
      <!-- Дерева та верхній схил лісу -->
      <area shape="poly" coords="0,0,300,0,300,68,215,62,155,70,95,48,0,38,0,0"
            href="#" alt="Ліс і крони дерев"
            title="Крони дерев та верхній схил лісу над урвищем">

      <!-- Основний каскад і потоки водоспаду -->
      <area shape="poly" coords="142,72,212,68,225,120,185,168,118,172,72,158,108,118,142,72"
            href="#" alt="Потоки водоспаду"
            title="Каскад водоспаду: білі потоки води, що спадають у водойму">

      <!-- Лівий моховитий схил і бічні струмені -->
      <area shape="poly" coords="0,38,95,48,142,72,108,118,72,158,118,172,95,185,0,182,0,38"
            href="#" alt="Лівий скелястий схил"
            title="Лівий схил: моховиті камені, зелень і бічні струмені води">

      <!-- Правий скелястий берег із зеленню -->
      <area shape="poly" coords="212,68,300,68,300,185,185,182,185,168,225,120,212,68"
            href="#" alt="Правий схил"
            title="Правий берег: стрімка скеля, густа зелень і рослинність">

      <!-- Темна водойма внизу -->
      <area shape="poly" coords="0,182,95,185,185,182,300,185,300,260,0,260,0,182"
            href="#" alt="Нижня водойма"
            title="Водойма біля підніжжя водоспаду: прохолодна темна вода та піна">
   </map>

   <center>
      <img src="image/vodopad2.jpg" width="300" height="260" border="2" usemap="#waterfall_poly_map" alt="Лісовий водоспад серед зелених скель і дерев над водоймою">
   </center>

   <br>
   <p align="center">
      <font face="Verdana" size="2" color="#6C3483">
         <i>Усі активні зони задано тегом &lt;area shape="poly"&gt; із замиканням координат.</i>
      </font>
   </p>

</body>
</html>
